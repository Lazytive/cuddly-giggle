name: ALOS Earth mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # to publish the rolling beta release
    env:
      MOD_VERSION: 0.1.0-beta.${{ github.run_number }}
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make test data (Python reference implementation)
        run: |
          python -m pip install --quiet numpy tifffile imagecodecs
          python scripts/make_testdata.py "$GITHUB_WORKSPACE/mod/build/testdata"

      - name: Resolve Fabric versions for Minecraft 1.21.1
        run: |
          set -euo pipefail
          meta=$(curl -sSf https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml)
          fabric=$(echo "$meta" | grep -oP '<version>\K[^<]*\+1\.21\.1(?=</version>)' | sort -V | tail -1)
          loader=$(curl -sSf https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -oP '<release>\K[^<]*')
          echo "Resolved fabric-api $fabric, fabric-loader $loader (pinned: $(grep -E '^(fabric|loader)_version' gradle.properties | tr '\n' ' '))"
          echo "FABRIC_VERSION=$fabric" >> "$GITHUB_ENV"
          echo "LOADER_VERSION=$loader" >> "$GITHUB_ENV"

      - name: Build and run core tests
        env:
          ALOSEARTH_TESTDATA: ${{ github.workspace }}/mod/build/testdata
          ALOSEARTH_NET: "1"
        run: ./gradlew build --stacktrace -Pfabric_version="$FABRIC_VERSION" -Ploader_version="$LOADER_VERSION" -Pmod_version="$MOD_VERSION"

      - name: Prepare a dedicated server with an ALOS Earth world
        run: |
          mkdir -p run/config
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          level-type=alosearth\:earth
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          sync-chunk-writes=false
          PROPS
          sed -i 's/^ *//' run/server.properties
          d="$GITHUB_WORKSPACE/mod/build/testdata/data"
          cat > run/config/alosearth.json <<JSON
          {
            "aw3d30": ["$d/aw3d30"],
            "fill_dem": [],
            "bathymetry": ["$d/gebco.tif"],
            "climate": ["$d/climate"],
            "auto_download": false,
            "cache_mb": 256
          }
          JSON

      - name: Run the in-game self-test on a real server
        env:
          ALOSEARTH_SELFTEST: "1"
        run: |
          timeout 1500 ./gradlew runServer --stacktrace -Pfabric_version="$FABRIC_VERSION" -Ploader_version="$LOADER_VERSION" -Pmod_version="$MOD_VERSION" || true
          cat run/alosearth-selftest.txt
          grep -q "ALOSEARTH SELFTEST PASS" run/alosearth-selftest.txt

      - name: Run the in-game self-test on a true 1:30 world
        env:
          ALOSEARTH_SELFTEST: "1"
        run: |
          rm -rf run/world run/alosearth-selftest.txt
          sed -i 's/^level-type=.*/level-type=alosearth\\:earth_true_scale/' run/server.properties
          timeout 1500 ./gradlew runServer --stacktrace -Pfabric_version="$FABRIC_VERSION" -Ploader_version="$LOADER_VERSION" -Pmod_version="$MOD_VERSION" || true
          cat run/alosearth-selftest.txt
          grep -q "world height -320..384" run/alosearth-selftest.txt
          grep -q "ALOSEARTH SELFTEST PASS" run/alosearth-selftest.txt
          sed -i 's/^level-type=.*/level-type=alosearth\\:earth/' run/server.properties

      - name: Run the in-game self-test on a 1:1 world (deep ocean layers)
        env:
          ALOSEARTH_SELFTEST: "1"
        run: |
          rm -rf run/world run/alosearth-selftest.txt
          sed -i 's/^level-type=.*/level-type=alosearth\\:earth_1to1/' run/server.properties
          start=$(date +%s)
          timeout 1500 ./gradlew runServer --stacktrace -Pfabric_version="$FABRIC_VERSION" -Ploader_version="$LOADER_VERSION" -Pmod_version="$MOD_VERSION" || true
          echo "world creation + checks took $(( $(date +%s) - start )) s"
          cat run/alosearth-selftest.txt
          grep -q "world height -2032..2032" run/alosearth-selftest.txt
          grep -q "pig crossed the layer join both ways" run/alosearth-selftest.txt
          grep -q "ALOSEARTH SELFTEST PASS" run/alosearth-selftest.txt
          sed -i 's/^level-type=.*/level-type=alosearth\\:earth/' run/server.properties

      - name: Self-test a fresh world using only auto-downloaded elevation
        env:
          ALOSEARTH_SELFTEST: auto
        run: |
          rm -rf run/world run/alosearth-selftest.txt
          cat > run/config/alosearth.json <<JSON
          {
            "aw3d30": [],
            "fill_dem": [],
            "bathymetry": [],
            "climate": [],
            "auto_download": true,
            "cache_mb": 256
          }
          JSON
          start=$(date +%s)
          timeout 900 ./gradlew runServer --stacktrace -Pfabric_version="$FABRIC_VERSION" -Ploader_version="$LOADER_VERSION" -Pmod_version="$MOD_VERSION" || true
          echo "world creation + checks took $(( $(date +%s) - start )) s"
          grep -h "Elevation download" run/logs/latest.log | tail -5 || true
          cat run/alosearth-selftest.txt
          grep -q "ALOSEARTH SELFTEST PASS" run/alosearth-selftest.txt

      - name: Upload server log and self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            mod/run/logs/latest.log
            mod/run/alosearth-selftest.txt
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: alos-earth-mod
          path: mod/build/libs/*.jar

      - name: Publish the rolling beta release (stable download link)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/minecraft-alos-world-generation-tgwoi0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" build/alos-earth.jar
          gh release delete alos-earth-beta --yes --cleanup-tag || true
          gh release create alos-earth-beta build/alos-earth.jar tools/update-alos-earth.ps1 \
            --prerelease --target "$GITHUB_SHA" \
            --title "ALOS Earth beta (latest build: $MOD_VERSION)" \
            --notes "Latest build of the ALOS Earth mod for Minecraft 1.21.1 (Fabric), from commit $GITHUB_SHA. It passed the core tests and the in-game self-test on a real server.

          Install: put alos-earth.jar in your instance's mods folder (needs Fabric Loader + Fabric API), or let update-alos-earth.ps1 do it on every launch (see mod/README.md)."
