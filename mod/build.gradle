plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The terrain core (io.github.lazytive.alosearth.core) is plain Java with no
// Minecraft dependency; its tests are simple main() programs so they also run
// with just a JDK (see mod/scripts/core-test.sh).
tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Runs the pure-Java terrain core tests'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.lazytive.alosearth.core.CoreTests'
    args = [System.getenv('ALOSEARTH_TESTDATA') ?: "${rootDir}/build/testdata"]
}
check.dependsOn tasks.named('coreTest')
