[[mods]]
modId = "alosearth"
version = "${version}"
displayName = "ALOS Earth"
authors = "Lazytive"
displayURL = "https://github.com/Lazytive/cuddly-giggle"
description = '''
The whole Earth as Minecraft world types (Minecraft-like, 1:30, 1:10, 1:5, the largest to-scale Earth, and 1:1), generated on the fly from JAXA ALOS AW3D30 and Copernicus elevation data, on a cube-shaped globe you can walk all the way around.
'''

[[mixins]]
config = "alosearth.mixins.json"

[[dependencies.alosearth]]
